<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mission</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
    --bg: #0a0e14;
    --surface: #131922;
    --border: #1f2630;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: max-content; height: max-content; }
body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
}
.shell { padding: 10px; width: 440px; }

.card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; box-shadow: var(--shadow);
}
.card.armed { border-left: 3px solid var(--accent); }
.card.paused { border-left: 3px solid var(--warn); }
.card.blocked { border-left: 3px solid var(--warn); }
.card.complete { border-left: 3px solid var(--good); }

.topline {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 8px;
}
.status {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    font-weight: 700; color: var(--accent);
}
.status.paused { color: var(--warn); }
.status.blocked { color: var(--warn); }
.status.complete { color: var(--good); }
.status.idle { color: var(--muted); }

.goal {
    font-size: 16px; font-weight: 650; margin-bottom: 10px;
    word-break: break-word;
}
.goal.empty { color: var(--muted); font-style: italic; font-weight: 400; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
.stat { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04); border-radius: 7px; padding: 8px; min-width: 0; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 2px; }
.stat-value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-value.dim { color: var(--muted); font-size: 14px; font-weight: 400; }
.token-line { color: var(--muted); font-size: 12px; margin-top: 1px; }

.actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px;
}
button {
    font: inherit; font-weight: 600;
    padding: 10px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: background 0.1s, border-color 0.1s, transform 0.05s;
}
button:hover:not(:disabled) { background: #1c2330; border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent); color: #0a0e14; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: #79b8ff; border-color: #79b8ff; }
button.warn { color: var(--warn); border-color: rgba(210,153,34,0.4); }
button.warn:hover:not(:disabled) { background: rgba(210,153,34,0.12); border-color: var(--warn); }
button.danger { color: var(--bad); border-color: rgba(248,81,73,0.4); }
button.danger:hover:not(:disabled) { background: rgba(248,81,73,0.12); border-color: var(--bad); }
button.span2 { grid-column: span 2; }
.refresh-btn {
    width: 26px; height: 24px; padding: 0; display: grid; place-items: center;
    font-size: 13px; line-height: 1; color: var(--muted);
}
.icon-btn {
    width: 100%; height: 52px; padding: 0; display: grid; place-items: center;
    font-size: 18px; line-height: 1; border-radius: 9px;
}

.complete-summary {
    background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.3);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 10px;
    font-size: 13px; color: var(--text);
}
.blocked-summary {
    background: rgba(210,153,34,0.08); border: 1px solid rgba(210,153,34,0.35);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 10px;
    font-size: 13px; color: var(--text);
}

.empty-state {
    text-align: center; padding: 18px 16px; color: var(--muted);
    background: var(--surface); border: 1px dashed var(--border); border-radius: 10px;
}
.empty-state code {
    display: inline-block; margin-top: 8px;
    background: var(--bg); padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--border); font-size: 12px;
}
.start-form { display: grid; gap: 10px; margin-top: 12px; text-align: left; }
.start-form label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--muted); font-weight: 700;
}
textarea {
    width: 100%; min-height: 92px; resize: vertical;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); padding: 10px;
    font: inherit;
}
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.18); }
</style>
</head>
<body>
<main class="shell">
<div id="root"></div>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";

let state = null;
let lastRenderedStatus = null;
let resizeRunId = 0;

function fmtDuration(ms) {
    if (!Number.isFinite(ms) || ms < 0) return "—";
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m " + (s % 60) + "s";
    const h = Math.floor(m / 60);
    return h + "h " + (m % 60) + "m";
}

function fmtRel(iso) {
    if (!iso) return "—";
    const ms = Date.now() - new Date(iso).getTime();
    if (ms < 5_000) return "just now";
    return fmtDuration(ms) + " ago";
}

function fmtNum(n) {
    return Number.isFinite(n) ? n.toLocaleString() : "—";
}

function render() {
    const root = document.getElementById("root");
    if (!state) {
        root.innerHTML = `<div class="empty-state">Loading…</div>`;
        lastRenderedStatus = null;
        scheduleResize();
        return;
    }
    if (state.status === "idle") {
        const shouldFocusObjective = lastRenderedStatus !== "idle";
        root.innerHTML = `
            <div class="empty-state">
                <div class="topline"><span></span>${refreshButtonHtml()}</div>
                <div>No active objective.</div>
                <form class="start-form" id="startForm">
                    <label for="objectiveInput">Objective</label>
                    <textarea id="objectiveInput" name="objective" placeholder="Describe the mission objective"></textarea>
                    <button class="primary" type="submit">Start mission</button>
                </form>
            </div>`;
        lastRenderedStatus = state.status;
        if (shouldFocusObjective) document.getElementById("objectiveInput")?.focus();
        scheduleResize();
        return;
    }

    const isComplete = state.status === "complete";
    const isBlocked = state.status === "blocked";
    const isPaused = state.status === "paused";
    const isArmed = state.status === "armed";
    const recoverLabel = isBlocked ? "Retry" : "Resume";
    const elapsed = state.createdAt ? Date.now() - new Date(state.createdAt).getTime() : null;
    const fired = state.continuationsFired || 0;
    const inputTokens = state.inputTokens || 0;
    const outputTokens = state.outputTokens || 0;

    root.innerHTML = `
        <div class="card ${state.status}">
            <div class="topline">
                <div class="status ${state.status}">${state.status}${state.inFlight ? " · firing" : ""}</div>
                ${refreshButtonHtml()}
            </div>
            <div class="goal">${escapeHtml(state.goal || "(no goal)")}</div>
            ${isComplete && state.completeSummary ? `
                <div class="complete-summary">✓ ${escapeHtml(state.completeSummary)}</div>` : ""}
            ${isBlocked && state.blockedSummary ? `
                <div class="blocked-summary">Blocked: ${escapeHtml(state.blockedSummary)}</div>` : ""}
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Turns</div>
                    <div class="stat-value">${fired}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Elapsed</div>
                    <div class="stat-value" id="elapsed">${fmtDuration(elapsed)}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Input tokens</div>
                    <div class="stat-value">${fmtNum(inputTokens)}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Output tokens</div>
                    <div class="stat-value">${fmtNum(outputTokens)}</div>
                </div>
            </div>
            <div class="actions">
                ${isPaused || isBlocked
                    ? `<button class="icon-btn primary" data-act="resume" title="${recoverLabel}" aria-label="${recoverLabel}">▶</button>`
                    : `<button class="icon-btn warn" data-act="pause" title="Pause" aria-label="Pause" ${isArmed ? "" : "disabled"}>⏸</button>`}
                <button class="icon-btn danger" data-act="clear" title="Clear" aria-label="Clear objective">✕</button>
            </div>
        </div>`;
    lastRenderedStatus = state.status;
    scheduleResize();
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;",
    }[c]));
}

function resizeToContent() {
    const shell = document.querySelector(".shell");
    if (!shell) return null;
    const rect = shell.getBoundingClientRect();
    const chromeWidth = Math.max(0, window.outerWidth - window.innerWidth);
    const rawChromeHeight = Math.max(0, window.outerHeight - window.innerHeight);
    const chromeHeight = rawChromeHeight > 0 ? rawChromeHeight : 36;
    const width = Math.ceil(rect.width + chromeWidth);
    const height = Math.ceil(rect.height + chromeHeight);
    try { window.resizeTo(width, height); } catch {}
    return { width, height };
}

function scheduleResize() {
    const runId = ++resizeRunId;
    let attempts = 0;
    const fitUntilStable = () => {
        if (runId !== resizeRunId) return;
        const target = resizeToContent();
        if (!target) return;
        const widthDelta = Math.abs(window.outerWidth - target.width);
        const heightDelta = Math.abs(window.outerHeight - target.height);
        attempts += 1;
        if ((widthDelta > 2 || heightDelta > 2) && attempts < 30) {
            requestAnimationFrame(fitUntilStable);
        }
    };
    requestAnimationFrame(fitUntilStable);
}

function refreshButtonHtml() {
    return `<button class="refresh-btn" data-refresh title="Refresh" aria-label="Refresh">↻</button>`;
}

document.addEventListener("click", (e) => {
    if (!e.target.closest("[data-refresh]")) return;
    location.reload();
});

document.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const action = btn.dataset.act;
    btn.disabled = true;
    try {
        const res = await fetch("/api/action", {
            method: "POST",
            headers: { "content-type": "application/json", "x-token": TOKEN },
            body: JSON.stringify({ action }),
        });
        if (!res.ok) console.error("action failed", action, res.status);
    } finally {
        btn.disabled = false;
    }
});

document.addEventListener("submit", async (e) => {
    if (e.target?.id !== "startForm") return;
    e.preventDefault();
    const form = e.target;
    const input = form.querySelector("#objectiveInput");
    const button = form.querySelector("button[type=submit]");
    const objective = input?.value?.trim() || "";
    if (!objective) {
        input?.focus();
        return;
    }
    if (button) button.disabled = true;
    try {
        const res = await fetch("/api/action", {
            method: "POST",
            headers: { "content-type": "application/json", "x-token": TOKEN },
            body: JSON.stringify({ action: "start", objective }),
        });
        if (!res.ok) console.error("action failed", "start", res.status);
    } finally {
        if (button) button.disabled = false;
    }
});

// Live tick for elapsed / lastFired without re-fetch.
setInterval(() => {
    if (!state || state.status === "idle") return;
    const elapsedEl = document.getElementById("elapsed");
    const lastEl = document.getElementById("lastFired");
    if (elapsedEl && state.createdAt) {
        elapsedEl.textContent = fmtDuration(Date.now() - new Date(state.createdAt).getTime());
    }
    if (lastEl) lastEl.textContent = fmtRel(state.lastFiredAt);
}, 1000);

let ws;
let backoff = 250;
let closing = false;
function connect() {
    if (closing) return;
    const url = `ws://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`;
    ws = new WebSocket(url);
    ws.onopen = () => {
        backoff = 250;
    };
    ws.onmessage = (ev) => {
        try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "state") {
                state = msg.state;
                render();
            } else if (msg.type === "close") {
                // Server-initiated shutdown — suppress reconnect, then close
                // the window. If window.close() is blocked (e.g. opened by
                // user navigation rather than --app=), at least the page
                // stays quiet and stops hammering the dead server.
                closing = true;
                try { ws.close(); } catch {}
                window.close();
            }
        } catch {}
    };
    ws.onclose = () => {
        if (closing) return;
        setTimeout(connect, backoff);
        backoff = Math.min(backoff * 2, 5000);
    };
    ws.onerror = () => { try { ws.close(); } catch {} };
}
connect();
</script>
</body>
</html>
